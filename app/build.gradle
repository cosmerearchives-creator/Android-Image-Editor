plugins {
    id 'com.android.application' version '8.7.3'
}

def releaseVersion = new Properties()
rootProject.file('version.properties').withInputStream { releaseVersion.load(it) }
def name = releaseVersion.getProperty('versionName')
if (!(name ==~ /(?:0|[1-9][0-9]{0,2})\.(?:0|[1-9][0-9]{0,2})\.(?:0|[1-9][0-9]{0,2})/)) {
    throw new GradleException('Expected a stable versionName with three components from 0 to 999')
}
def (major, minor, patch) = name.split('\\.').collect { it.toInteger() }

android {
    namespace 'com.cosmerearchives.androidimageeditor'
    compileSdk 35
    buildToolsVersion '35.0.0'

    defaultConfig {
        applicationId 'com.cosmerearchives.androidimageeditor'
        minSdk 28
        targetSdk 35
        versionName name
        versionCode major * 1000000 + minor * 1000 + patch
    }

    ndkVersion '26.3.11579264'
    defaultConfig {
        ndk { abiFilters 'arm64-v8a' }
    }
    buildFeatures { prefab true }
    externalNativeBuild {
        cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
    implementation 'org.khronos.openxr:openxr_loader_for_android:1.1.43'
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.23.2'
}
